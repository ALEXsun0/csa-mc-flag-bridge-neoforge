plugins {
    id 'net.neoforged.moddev' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'

    group = rootProject.mod_group_id
    version = rootProject.mod_version

    ext.mod_id = [
        terminal     : 'csa_flag_terminal',
        server       : 'csa_flag_bridge_server',
        aero         : 'csa_aero_bridge',
        'aero-server': 'csa_aero_bridge_server',
    ][project.name]
    ext.mod_name = [
        terminal     : 'CSA Flag Terminal',
        server       : 'CSA Flag Bridge Server',
        aero         : 'CSA Aero Bridge',
        'aero-server': 'CSA Aero Bridge Server',
    ][project.name]
    ext.mod_description = [
        terminal     : 'CSA flag terminal content block.',
        server       : 'Server-side Ret2Shell token binding and flag delivery bridge.',
        aero         : 'CSA flight recorder content block for Create Aeronautics.',
        'aero-server': 'Server-side Create Aeronautics stable-cruise certification addon for CSA Flag Bridge.',
    ][project.name]
    ext.mod_license = 'MIT'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    neoForge {
        enable {
            version = rootProject.neo_version
            disableRecompilation = true
        }
        mods {
            "${project.mod_id}" {
                sourceSet sourceSets.main
            }
        }
    }

    tasks.withType(ProcessResources).configureEach {
        def replaceProperties = [
            minecraft_version      : rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version            : rootProject.neo_version,
            neo_version_range      : rootProject.neo_version_range,
            loader_version_range   : rootProject.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_description        : project.mod_description,
            mod_license            : project.mod_license,
            mod_version            : rootProject.mod_version,
        ]
        inputs.properties replaceProperties
        filesMatching('META-INF/neoforge.mods.toml') {
            expand replaceProperties
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
