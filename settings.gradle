pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'net.neoforged.moddev.repositories' version '2.0.141'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'mc-flag-bridge-neoforge'
include 'terminal'
include 'server'
include 'aero'
include 'aero-server'
